# Pagine sorvegliate dal Doc Watcher.
# Quando il contenuto cambia (ignoring whitespace cosmetico), genera un item
# nel feed con badge "⚠️ Google ha aggiornato ..." e summary del diff.

pages:
  # Changelog ufficiale "What's new in Search documentation": elenca OGNI
  # modifica alla documentazione Google, anche alle pagine non monitorate
  # singolarmente qui sotto. È la rete di sicurezza che intercetta i cambiamenti
  # che altrimenti sfuggirebbero.
  - id: google_search_docs_changelog
    name: "Google Search — Changelog documentazione"
    url: https://developers.google.com/search/updates
    selector: "main article, main"
    type: html
    category: google_docs_change
    importance: 5

  - id: google_spam_policies
    name: "Google Spam Policies"
    url: https://developers.google.com/search/docs/essentials/spam-policies
    selector: "main article, main"
    type: html
    category: google_docs_change
    importance: 5

  - id: google_helpful_content
    name: "Google Helpful Content"
    url: https://developers.google.com/search/docs/fundamentals/creating-helpful-content
    selector: "main article, main"
    type: html
    category: google_docs_change
    importance: 5

  # Il PDF completo delle Quality Rater Guidelines e' piu' sotto
  # (google_quality_rater_guidelines_en). Non esiste una versione italiana:
  # i percorsi /it/, /de/, /fr/... servono tutti lo stesso PDF inglese
  # (verificato il 2026-11-19), per questo la vecchia voce "IT" e' stata tolta.
  # Questo e' il documento di sintesi che Google linka dalla pagina
  # "How Search Works > Rigorous testing" accanto al PDF completo.
  - id: google_quality_rater_overview
    name: "Google Quality Rater Guidelines: An Overview (PDF)"
    url: https://services.google.com/fh/files/misc/hsw-sqrg.pdf
    type: pdf
    category: google_docs_change
    importance: 5

  - id: google_ai_features_guidance
    name: "Google AI Features SEO Guidance"
    url: https://developers.google.com/search/docs/appearance/ai-features
    selector: "main article, main"
    type: html
    category: google_docs_change
    importance: 4

  - id: googlebot_docs
    name: "Googlebot Documentation"
    url: https://developers.google.com/search/docs/crawling-indexing/googlebot
    selector: "main article, main"
    type: html
    category: google_docs_change
    importance: 3

  - id: google_crawlers_overview
    name: "Overview of Google Crawlers"
    url: https://developers.google.com/crawling/docs/crawlers-fetchers/overview-google-crawlers
    selector: "main article, main"
    type: html
    category: google_docs_change
    importance: 4

  # Prima puntava a /appearance/structured-data, che e' la pagina degli
  # strumenti di test: la gallery e' l'elenco dei rich result supportati.
  - id: google_structured_data_gallery
    name: "Google Structured Data Search Gallery"
    url: https://developers.google.com/search/docs/appearance/structured-data/search-gallery
    selector: "main article, main"
    type: html
    category: google_docs_change
    importance: 3

  # openai.com risponde 403 ai client non-browser: la pagina non viene
  # letta. Lasciata cosi' per scelta (fonte poco rilevante), senza allarme.
  - id: openai_usage_policies
    name: "OpenAI Usage Policies"
    url: https://openai.com/policies/usage-policies/
