name = "osservatorioseo-cron"
main = "src/index.js"
compatibility_date = "2024-01-01"

[triggers]
# 05:00 UTC = 07:00 Europe/Rome (CEST, ora legale)
# 06:00 UTC = 07:00 Europe/Rome (CET, ora solare)
# Solo uno dei due e' le 07:00 a Roma: src/index.js scarta l'altro
# confrontando l'ora con Intl.DateTimeFormat. Il workflow daily-refresh
# ha la stessa guardia come rete di sicurezza.
crons = ["0 5 * * *", "0 6 * * *"]
