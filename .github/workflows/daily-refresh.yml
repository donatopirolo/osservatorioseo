name: Daily Refresh

on:
  # Scheduling gestito dal Cloudflare Worker (workers/cron-trigger) che triggera
  # workflow_dispatch alle 07:00 Europe/Rome. Più affidabile del cron GitHub Actions.
  workflow_dispatch:
    inputs:
      force:
        description: "Esegui anche fuori dalle 07:00 di Roma (per lanci manuali)"
        type: boolean
        required: false
        default: false

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Fissato a 24.04: ubuntu-latest e' passato a 26.04 (ottobre 2026) e Playwright
    # 1.60 non sa installare chromium li' ("does not support chromium on ubuntu26.04").
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
    steps:
      # Rete di sicurezza: il Worker gia' scarta il cron del fuso sbagliato, ma se
      # viene deployata una versione vecchia del Worker la pipeline girerebbe due
      # volte al giorno (costo AI e deploy doppi, pagine orfane in site/archivio).
      - name: Verifica che a Roma siano le 07
        id: timecheck
        run: |
          HOUR=$(TZ=Europe/Rome date +%H)
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "::notice::Lancio forzato a mano (a Roma sono le $HOUR)."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" = "07" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::A Roma sono le $HOUR, non le 07: run saltato. Usa force per forzarlo."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup uv
        if: steps.timecheck.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Setup Node
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.timecheck.outputs.run == 'true'
        run: |
          uv sync
          uv run playwright install --with-deps chromium
          npm install

      - name: Build Tailwind CSS
        if: steps.timecheck.outputs.run == 'true'
        run: npx @tailwindcss/cli -i ./tailwind_input.css -o ./site/tailwind.css --minify

      - name: Run refresh
        id: refresh
        if: steps.timecheck.outputs.run == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          TZ: Europe/Rome
        # shell: bash attiva pipefail, cosi' tee non nasconde l'exit code del refresh.
        shell: bash
        run: uv run python -m osservatorio_seo refresh 2>&1 | tee "$RUNNER_TEMP/refresh.log"

      - name: Commit and push
        if: steps.timecheck.outputs.run == 'true'
        run: |
          git config user.name "osservatorioseo-bot"
          git config user.email "bot@osservatorioseo.local"
          # Stage sia data/ che tutto site/ (include HTML SSG generati in site/archivio/,
          # site/docs/, site/categoria/, site/tag/, site/top-settimana/, ecc.)
          git add data/ site/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(feed): refresh $(TZ=Europe/Rome date +%Y-%m-%d)"
            # Retry on conflict con rebase (race condition con push manuali)
            for i in 1 2 3; do
              if git push 2>&1; then
                echo "push success on attempt $i"
                exit 0
              fi
              echo "push failed on attempt $i, rebasing…"
              git pull --rebase origin main || exit 1
            done
            echo "push failed after 3 attempts"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.timecheck.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy ./site \
            --project-name=osservatorioseo \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="refresh $(TZ=Europe/Rome date +%Y-%m-%d)"

      # Una pagina sorvegliata che non si legge (403, selettore rotto, pagina
      # anti-bot) prima finiva solo nel log: la policy OpenAI e schema.org
      # sono rimaste cieche per mesi. La pipeline conta i giorni di guasto in
      # _health.json; qui si apre (o aggiorna) un'unica issue dopo 3 giorni e
      # la si chiude quando tutto torna leggibile. Non fa fallire il run.
      - name: Avvisa se il Doc Watcher non legge delle pagine
        if: always() && steps.timecheck.outputs.run == 'true'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = 'data/state/doc_watcher/_health.json';
            if (!fs.existsSync(path)) return;
            const health = JSON.parse(fs.readFileSync(path, 'utf8'));
            const alerts = Object.entries(health.pages || {}).filter(([, v]) => v.alert);
            const { owner, repo } = context.repo;
            const title = '[doc-watcher] Pagine sorvegliate non leggibili';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'doc-watcher',
            });
            const existing = open.find(i => i.title === title);
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (alerts.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Tutte le pagine sorvegliate sono di nuovo leggibili. Run: ${run}`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed',
                });
              }
              return;
            }
            const rows = alerts.map(([id, v]) =>
              `| \`${id}\` | ${v.failing_since} | ${v.failing_days} | ${String(v.last_error).replace(/\|/g, '\\|')} |`);
            const body = [
              `Il Doc Watcher non riesce a leggere queste pagine da almeno ${health.alert_after_days} giorni: finche' non si sistemano, una loro modifica non verrebbe vista.`,
              '',
              '| Pagina | Guasta dal | Giorni | Ultimo errore |',
              '|---|---|---|---|',
              ...rows,
              '',
              'Di solito: selettore da aggiornare o URL cambiato in `config/doc_watcher.yml`, oppure la fonte blocca i bot (in quel caso `alert: false` se non vale la pena forzarla).',
              '',
              `Ultimo run: ${run}`,
            ].join('\n');
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ['doc-watcher', 'automated'],
              });
            }

      # Le guide sui temi (content/temi/) sono scritte a mano: quando arrivano
      # notizie importanti o cambia la documentazione sorvegliata dopo la data
      # di revisione, il publisher lo scrive in data/state/temi/review.json e
      # qui si apre (o aggiorna) una issue per rileggerle.
      - name: Avvisa se una guida sui temi va riletta
        if: always() && steps.timecheck.outputs.run == 'true'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = 'data/state/temi/review.json';
            if (!fs.existsSync(path)) return;
            const reviews = JSON.parse(fs.readFileSync(path, 'utf8'));
            const { owner, repo } = context.repo;
            const title = '[temi] Guide da rileggere';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'temi',
            });
            const existing = open.find(i => i.title === title);
            const site = 'https://www.osservatorioseo.com';
            if (reviews.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: 'Tutte le guide risultano rilette dopo le ultime novita\'.',
                });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              }
              return;
            }
            const blocks = reviews.map(r => [
              `### [${r.slug}](${site}/dossier/${r.slug}/) — rivista il ${r.reviewed}`,
              ...r.news.map(n => `- ${n.date} notizia: [${n.title}](${site}${n.path})`),
              ...r.doc_changes.map(c => `- ${c.date} documentazione: [${c.title}](${site}${c.path})`),
            ].join('\n'));
            const body = [
              'Dopo l\'ultima revisione di queste guide sono arrivate novita\' importanti. Rileggi la parte fissa in `content/temi/<slug>.md`, aggiorna i numeri in `<slug>.numbers.yml` se serve, e porta `reviewed:` alla data di oggi: la issue si chiude da sola al run successivo.',
              '',
              ...blocks,
            ].join('\n');
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['temi', 'automated'] });
            }

      # La homepage e' renderizzata dal feed corrente: un feed vuoto la
      # lascia senza articoli, e nessun controllo se ne accorgerebbe
      # (feed_health considera sano un run con zero riassunti, e tutte le
      # pagine continuano a rispondere 200). E' successo il 2026-09-07.
      # La pipeline ora si rifiuta di pubblicare un feed vuoto, ma il
      # deploy passa da wrangler e da site/ sul disco: qui si verifica il
      # risultato vero, quello che vede il lettore.
      - name: Verifica che la home abbia articoli
        if: steps.timecheck.outputs.run == 'true'
        run: |
          URL=https://www.osservatorioseo.com/
          for i in 1 2 3 4 5; do
            N=$(curl -sS --max-time 20 "$URL?cachebust=$(date +%s)" | grep -c '<article' || true)
            echo "tentativo $i: $N schede articolo in home"
            if [ "$N" -gt 0 ]; then
              echo "::notice::Home verificata: $N schede articolo."
              exit 0
            fi
            sleep 15
          done
          echo "::error::La homepage non contiene nessuna scheda articolo dopo il deploy."
          exit 1

      # Sotto il 50% di riassunti falliti feed_health considera sano il run: il
      # 2026-11-04 il credito e' finito a meta' run e nessuno e' stato avvisato.
      # Il controllo sta dopo il deploy: l'edizione parziale si pubblica comunque.
      # always(): deve girare anche quando il refresh e' fallito, altrimenti
      # l'issue non dice il motivo (2026-11-19: tetto mensile della chiave).
      # OpenRouter usa due codici: 402 = credito dell'account finito,
      # 403 "Key limit exceeded" = raggiunto il limite di spesa della chiave.
      - name: Avvisa se manca credito OpenRouter
        id: credit
        if: always() && steps.timecheck.outputs.run == 'true'
        run: |
          LOG="$RUNNER_TEMP/refresh.log"
          [ -f "$LOG" ] || exit 0
          if grep -q "402 Payment Required" "$LOG"; then
            echo "::error::OpenRouter ha risposto 402: credito dell'account finito o quasi. Ricarica."
            echo "reason=credit" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if grep -q "Key limit exceeded" "$LOG"; then
            echo "::error::OpenRouter ha risposto 403: raggiunto il limite di spesa della chiave. Alzalo in Settings > Keys."
            echo "reason=keylimit" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const reason = '${{ steps.credit.outputs.reason }}';
            const published = '${{ steps.refresh.outcome }}' === 'success'
              ? "L'edizione e' stata pubblicata, ma con meno articoli."
              : "L'edizione NON e' stata pubblicata.";
            const hint = reason === 'credit'
              ? `\n\nCredito OpenRouter dell'account finito o quasi (HTTP 402): ricarica. ${published}`
              : reason === 'keylimit'
              ? `\n\nRaggiunto il limite di spesa della chiave OpenRouter (HTTP 403 "Key limit exceeded"): alzalo in Settings > Keys. ${published}`
              : '';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[osservatorioseo] Workflow failed ${date}`,
              body: `Daily refresh failed on ${date}.${hint}\n\nSee run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'automated']
            });
