name: Daily Refresh

on:
  # Scheduling gestito dal Cloudflare Worker (workers/cron-trigger) che triggera
  # workflow_dispatch alle 07:00 Europe/Rome. Più affidabile del cron GitHub Actions.
  workflow_dispatch:
    inputs:
      force:
        description: "Esegui anche fuori dalle 07:00 di Roma (per lanci manuali)"
        type: boolean
        required: false
        default: false

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
    steps:
      # Rete di sicurezza: il Worker gia' scarta il cron del fuso sbagliato, ma se
      # viene deployata una versione vecchia del Worker la pipeline girerebbe due
      # volte al giorno (costo AI e deploy doppi, pagine orfane in site/archivio).
      - name: Verifica che a Roma siano le 07
        id: timecheck
        run: |
          HOUR=$(TZ=Europe/Rome date +%H)
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "::notice::Lancio forzato a mano (a Roma sono le $HOUR)."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" = "07" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::A Roma sono le $HOUR, non le 07: run saltato. Usa force per forzarlo."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup uv
        if: steps.timecheck.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Setup Node
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: steps.timecheck.outputs.run == 'true'
        run: |
          uv sync
          uv run playwright install --with-deps chromium
          npm install

      - name: Build Tailwind CSS
        if: steps.timecheck.outputs.run == 'true'
        run: npx @tailwindcss/cli -i ./tailwind_input.css -o ./site/tailwind.css --minify

      - name: Run refresh
        if: steps.timecheck.outputs.run == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TZ: Europe/Rome
        run: uv run python -m osservatorio_seo refresh

      - name: Commit and push
        if: steps.timecheck.outputs.run == 'true'
        run: |
          git config user.name "osservatorioseo-bot"
          git config user.email "bot@osservatorioseo.local"
          # Stage sia data/ che tutto site/ (include HTML SSG generati in site/archivio/,
          # site/docs/, site/categoria/, site/tag/, site/top-settimana/, ecc.)
          git add data/ site/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(feed): refresh $(TZ=Europe/Rome date +%Y-%m-%d)"
            # Retry on conflict con rebase (race condition con push manuali)
            for i in 1 2 3; do
              if git push 2>&1; then
                echo "push success on attempt $i"
                exit 0
              fi
              echo "push failed on attempt $i, rebasing…"
              git pull --rebase origin main || exit 1
            done
            echo "push failed after 3 attempts"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.timecheck.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy ./site \
            --project-name=osservatorioseo \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="refresh $(TZ=Europe/Rome date +%Y-%m-%d)"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[osservatorioseo] Workflow failed ${date}`,
              body: `Daily refresh failed on ${date}.\n\nSee run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'automated']
            });
