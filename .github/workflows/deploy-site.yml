name: Deploy site

# Pubblica su Cloudflare Pages il contenuto di site/ COSI' COM'E' NEL REPO:
# non esegue la pipeline, non chiama modelli AI, non committa nulla.
# Serve per vedere online una modifica a template/publisher senza aspettare
# il run automatico delle 07:00.

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rifiuta i rami diversi da main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Questo workflow deploya sempre con --branch=main." >&2
          echo "::error::Lanciarlo da '${{ github.ref_name }}' pubblicherebbe quel ramo in produzione." >&2
          echo "::error::Fai prima il merge su main, poi rilancia." >&2
          exit 1

      - uses: actions/checkout@v4

      - name: Controlla che site/ non sia vuota
        run: |
          COUNT=$(find site -name index.html | wc -l)
          echo "pagine trovate: $COUNT"
          if [ "$COUNT" -lt 50 ]; then
            echo "::error::Solo $COUNT pagine in site/: sembra un rebuild incompleto, non deployo." >&2
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy ./site \
            --project-name=osservatorioseo \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="deploy manuale ${GITHUB_SHA:0:7}"
