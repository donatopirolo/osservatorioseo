name: Dossier monthly update

on:
  schedule:
    # Il 1° di ogni mese alle 09:00 Europe/Rome circa (cron in UTC, quindi
    # 10:00 durante l'ora legale). Sfasato dopo il tracker (07:00 UTC) per
    # non sovrapporre i commit su main. Cadenza mensile (D10): i dossier
    # sono contenuto evergreen, non hanno materiale nuovo ogni settimana —
    # min_new_items filtrava comunque la maggior parte dei run settimanali.
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rigenera tutti i dossier anche senza item nuovi"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  update-dossiers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Setup Node (for Tailwind CLI)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python deps
        run: |
          uv sync

      - name: Install Node deps (Tailwind CLI)
        run: npm install

      # L'exit code si controlla in fondo: se un dossier fallisce, quelli
      # riusciti si committano e si pubblicano comunque.
      - name: Update dossiers
        id: update
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set +e
          uv run python scripts/update_pillars.py ${{ inputs.force && '--force' || '' }} 2>&1 \
            | tee "$RUNNER_TEMP/update.log"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Rebuild Tailwind CSS
        run: npx @tailwindcss/cli -i ./tailwind_input.css -o ./site/tailwind.css --minify

      - name: Rebuild SSG HTML
        run: uv run python scripts/rebuild_seo_html.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pillars site
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            MONTH=$(date -u +'%Y-%m')
            git commit -m "chore(dossier): monthly update $MONTH"
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main
            done
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy ./site \
            --project-name=osservatorioseo \
            --branch=main \
            --commit-hash="$(git rev-parse HEAD)" \
            --commit-message="dossier monthly update" \
            --commit-dirty=true

      - name: Fail if update failed
        if: steps.update.outputs.code != '0'
        run: |
          if grep -q "402 Payment Required" "$RUNNER_TEMP/update.log"; then
            echo "::error::OpenRouter ha risposto 402: credito finito o limite della chiave."
          fi
          echo "::error::update_pillars.py e' uscito con codice ${{ steps.update.outputs.code }}"
          exit 1

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const month = new Date().toISOString().slice(0, 7);
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[osservatorioseo] Dossier: workflow fallito ${month}`,
              body: `L'aggiornamento mensile dei dossier e' fallito. Se il log riporta 402, e' OpenRouter (credito o limite della chiave).\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'automated']
            });
