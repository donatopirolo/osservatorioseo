name: Dossier monthly update

on:
  schedule:
    # Il 1° di ogni mese alle 09:00 Europe/Rome circa (cron in UTC, quindi
    # 10:00 durante l'ora legale). Sfasato dopo il tracker (07:00 UTC) per
    # non sovrapporre i commit su main. Cadenza mensile (D10): i dossier
    # sono contenuto evergreen, non hanno materiale nuovo ogni settimana —
    # min_new_items filtrava comunque la maggior parte dei run settimanali.
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rigenera tutti i dossier anche senza item nuovi"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-dossiers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Setup Node (for Tailwind CLI)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python deps
        run: |
          uv sync

      - name: Install Node deps (Tailwind CLI)
        run: npm install

      - name: Update dossiers
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run python scripts/update_pillars.py ${{ inputs.force && '--force' || '' }}

      - name: Rebuild Tailwind CSS
        run: npx @tailwindcss/cli -i ./tailwind_input.css -o ./site/tailwind.css --minify

      - name: Rebuild SSG HTML
        run: uv run python scripts/rebuild_seo_html.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pillars site
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            MONTH=$(date -u +'%Y-%m')
            git commit -m "chore(dossier): monthly update $MONTH"
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main
            done
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy ./site \
            --project-name=osservatorioseo \
            --branch=main \
            --commit-hash="$(git rev-parse HEAD)" \
            --commit-message="dossier monthly update" \
            --commit-dirty=true
